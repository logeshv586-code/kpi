# USE THIS ON THE SERVER when Nginx + uvicorn run directly on the host (copy dist deploy).
# proxy_pass must be 127.0.0.1:8000 — NOT "backend" (that name only exists in Docker).
server {
  listen 80;
  server_name _;

  # Required for employee / KPI Excel imports (max 10 MB in FastAPI).
  client_max_body_size 10m;

  root /usr/share/nginx/html;
  index index.html;

  # Copy dist/ into root above. Proxy API to FastAPI on the SAME machine.
  location /api/ {
    # Chrome "Local network access" / CORS preflight (Authorization + multipart uploads).
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
      add_header Access-Control-Allow-Private-Network "true" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }

    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Private-Network "true" always;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:8000/uploads/;
  }

  location /samples/ {
    proxy_pass http://127.0.0.1:8000/samples/;
  }

  location / {
    try_files $uri /index.html;
  }
}
