services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kpi_db
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: eagle123
    volumes:
      - kpi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://kpi:eagle123@db:5432/kpi_db
      SECRET_KEY: dev-docker-secret-change-this-to-a-long-random-value
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.85:5173,http://localhost:8080,http://127.0.0.1:8080,http://192.168.1.85:8080
      FRONTEND_URL: http://localhost:8080
      KPI_UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  kpi_pgdata:
