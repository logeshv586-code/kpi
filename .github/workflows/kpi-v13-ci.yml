name: KPI v1.3 CI

on:
  push:
    branches: [main, feature/kpi-review-periods-thresholds]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx

      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests

      - name: KPI v1.3 focused rules
        env:
          DATABASE_URL: sqlite:////tmp/kpi_v13_ci.db
          SECRET_KEY: test-secret-test-secret-test-secret-123
        run: PYTHONPATH=backend python backend/tests/run_v13_rule_tests.py

      - name: KPI v1.3 recursive hierarchy
        env:
          DATABASE_URL: sqlite:////tmp/kpi_v13_hierarchy_ci.db
          SECRET_KEY: test-secret-test-secret-test-secret-123
        run: PYTHONPATH=backend python backend/tests/run_hierarchy_v13_tests.py

      - name: Existing KPI regression suite
        env:
          DATABASE_URL: sqlite:////tmp/kpi_v12_ci.db
          SECRET_KEY: test-secret-test-secret-test-secret-123
        run: PYTHONPATH=backend python backend/tests/run_enhancement_tests.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
